name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-publish-prerelease:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run safety regression tests
        run: npm test

      - name: Create or reuse the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $releaseUrl = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$([Uri]::EscapeDataString($tag))"

          try {
            Invoke-RestMethod -Method Get -Uri $releaseUrl -Headers $headers -ErrorAction Stop | Out-Null
            Write-Output "Reusing release $tag."
          } catch {
            if ([int]$_.Exception.Response.StatusCode -ne 404) {
              throw
            }

            $release = @{
              tag_name = $tag
              target_commitish = $env:GITHUB_SHA
              name = $version
              prerelease = $version -match "-"
              draft = $false
            } | ConvertTo-Json
            Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases" -Headers $headers -ContentType "application/json" -Body $release | Out-Null
            Write-Output "Created release $tag."
          }

      - name: Build and publish internal prerelease
        run: npm run release:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}

      - name: Upload published installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: OBTools-Automated-Backups-Windows-Installer
          path: |
            dist/*.exe
            dist/*.yml
          if-no-files-found: error
